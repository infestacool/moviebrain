<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Moviebrain</title>
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-title" content="Moviebrain">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">🧠 Moviebrain</div>
    <div class="actions">
      <div id="tv-view" class="segmented" role="radiogroup" aria-label="Show facts about" hidden>
        <button role="radio" data-view="episode" aria-checked="true">Episode</button>
        <button role="radio" data-view="series" aria-checked="false">Series</button>
      </div>
      <button id="spoilers" class="pill-toggle" aria-pressed="false" title="Spoilers hidden: tap a blurred fact to reveal it">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="spoiler-icon" d=""/></svg><span class="label">Spoilers</span>
      </button>
      <a id="settings-link" class="icon-link" href="/settings" title="Settings" aria-label="Settings" hidden>⚙︎<span class="label"> Settings</span></a>
      <button id="signout" class="icon-link" title="Sign out" hidden>Sign out</button>
    </div>
  </header>

  <section id="screen" class="screen" hidden aria-live="polite">
    <div class="screen-top">
      <div class="screen-heading">
        <div id="screen-title" class="screen-title"></div>
        <div id="screen-sub" class="screen-sub"></div>
      </div>
      <div id="screen-clock" class="screen-clock"></div>
    </div>
    <div class="screen-fact">
      <div id="screen-source" class="screen-source"></div>
      <p id="screen-text" class="screen-text"></p>
    </div>
    <div class="screen-bottom">
      <div class="screen-progress"><div id="screen-progress"></div></div>
      <div class="screen-timer"><div id="screen-timer"></div></div>
    </div>
    <div class="screen-controls" role="toolbar" aria-label="Second screen controls">
      <button id="screen-prev" aria-label="Previous fact">‹</button>
      <button id="screen-play" aria-label="Pause"></button>
      <button id="screen-next" aria-label="Next fact">›</button>
      <button id="screen-speed" class="wide" title="Time per fact"></button>
      <button id="screen-exit" class="wide">Exit</button>
      <p id="screen-note" class="screen-note" hidden></p>
    </div>
  </section>

  <nav id="sessions" class="sessions" hidden></nav>

  <main>
    <section id="empty" class="empty" hidden>
      <div class="empty-icon">🍿</div>
      <h1>Nothing playing</h1>
      <p id="empty-detail">Start a movie or TV show and its trivia will appear here.</p>
      <p class="screen-link"><button id="empty-screen" class="link-reset">Open second screen</button></p>
      <p id="setup-link" hidden><a class="link-button" href="/settings">Open settings</a></p>
      <div id="pick" class="pick" hidden>
        <button id="pick-open" class="pick-card">
          <div class="cover"><span id="pick-cover-title"></span><img id="pick-poster" alt=""></div>
          <div class="pick-text">
            <div class="pick-label">Tonight's pick</div>
            <div id="pick-title" class="pick-title"></div>
            <p id="pick-teaser" class="pick-teaser"></p>
            <div id="pick-sub" class="pick-sub"></div>
          </div>
        </button>
        <button id="pick-another" class="pick-another" title="Pick another" aria-label="Pick another">↻</button>
      </div>
      <form id="search" class="search" role="search">
        <div class="search-box">
          <input id="search-input" type="search" placeholder="Or look up any movie or show…" autocomplete="off"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggestions">
          <ul id="search-suggestions" class="suggestions" role="listbox" hidden></ul>
        </div>
        <button type="submit">Look up</button>
      </form>
      <div id="recent" class="recent" hidden>
        <h2 id="recent-title" class="recent-title">Recently added</h2>
        <div id="recent-shelf" class="shelf"></div>
      </div>
    </section>

    <section id="movie" hidden>
      <div class="hero">
        <img id="poster" class="poster" alt="">
        <div class="hero-text">
          <h1 id="title"></h1>
          <p id="episode-line" class="episode-line" hidden></p>
          <p id="tagline" class="tagline"></p>
          <p id="meta" class="meta"></p>
          <ul id="glance" class="glance" hidden></ul>
          <div id="playback" class="playback" hidden>
            <div id="progress" class="progress"><div id="progress-bar"></div></div>
            <p id="progress-text" class="meta small"></p>
          </div>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button role="tab" data-tab="spotlight" class="active">Spotlight</button>
        <button role="tab" data-tab="imdb">Trivia <span id="imdb-count" class="count"></span></button>
        <button role="tab" data-tab="goofs">Goofs <span id="goofs-count" class="count"></span></button>
        <button role="tab" data-tab="wiki">Wikipedia</button>
        <button role="tab" data-tab="cast">Cast</button>
      </div>

      <div id="loading" class="loading" hidden>Finding trivia…</div>
      <div id="error" class="error" hidden></div>

      <div id="tab-spotlight" class="panel">
        <article id="spot-card" class="spot-card">
          <div id="spot-source" class="spot-source"></div>
          <p id="spot-text" class="spot-text"></p>
        </article>
        <div class="spot-controls">
          <button id="spot-prev" class="icon-button" aria-label="Previous fact">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
          </button>
          <button id="spot-auto" class="auto-toggle icon-button" aria-pressed="true" aria-label="Auto-advance" title="Auto-advance: on">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6c3.3 0 6 2.7 6 6 0 1-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.3 0-6-2.7-6-6 0-1 .25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
          </button>
          <button id="spot-next" class="icon-button" aria-label="Next fact">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 8.6 7.4l4.6 4.6-4.6 4.6L10 18l6-6z"/></svg>
          </button>
          <button id="spot-screen" class="icon-button" aria-label="Second screen" title="Second screen: big, hands-free facts for a tablet by the TV">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z"/></svg>
          </button>
        </div>
        <p id="spot-note" class="spot-note" aria-live="polite"></p>
        <div id="spot-timer" class="spot-timer"><div></div></div>
      </div>

      <div id="tab-imdb" class="panel" hidden>
        <ol id="imdb-list" class="facts"></ol>
        <button id="imdb-read-toggle" class="read-toggle" type="button" hidden></button>
      </div>

      <div id="tab-goofs" class="panel" hidden>
        <ol id="goofs-list" class="facts"></ol>
        <button id="goofs-read-toggle" class="read-toggle" type="button" hidden></button>
      </div>

      <div id="tab-wiki" class="panel" hidden>
        <div id="wiki-content"></div>
      </div>

      <div id="tab-cast" class="panel" hidden>
        <div id="cast-grid" class="cast-grid"></div>
      </div>

      <footer id="source-links" class="source-links" hidden></footer>

      <button id="back-to-playing" class="link-button" hidden>← Back to what's playing</button>
    </section>
  </main>

  <dialog id="person" class="sheet" aria-labelledby="person-name">
    <div class="sheet-inner">
      <div class="sheet-head">
        <div class="person-head">
          <div id="person-photo" class="avatar large"></div>
          <div><h2 id="person-name"></h2><p id="person-meta" class="meta"></p></div>
        </div>
        <button id="person-close" class="sheet-close" aria-label="Close">✕</button>
      </div>
      <div id="person-body"></div>
    </div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
