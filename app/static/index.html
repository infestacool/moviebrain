<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Triviarr</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="backdrop" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">🎬 Triviarr</div>
    <div class="actions">
      <button id="sources-button" class="pill-toggle" title="Choose sources and sections">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg><span class="label">Sources</span>
      </button>
      <button id="spoilers" class="pill-toggle" aria-pressed="false" title="Spoilers hidden: tap a blurred fact to reveal it">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="spoiler-icon" d=""/></svg><span class="label">Spoilers</span>
      </button>
      <a id="settings-link" class="icon-link" href="/settings" title="Settings" aria-label="Settings" hidden>⚙︎<span class="label"> Settings</span></a>
      <button id="signout" class="icon-link" title="Sign out" hidden>Sign out</button>
    </div>
  </header>

  <nav id="sessions" class="sessions" hidden></nav>

  <main>
    <section id="empty" class="empty" hidden>
      <div class="empty-icon">🍿</div>
      <h1>Nothing playing</h1>
      <p id="empty-detail">Start a movie or TV show on Plex or Jellyfin and its trivia will appear here.</p>
      <p id="setup-link" hidden><a class="link-button" href="/settings">Open settings</a></p>
      <form id="search" class="search">
        <input id="search-input" type="search" placeholder="Or look up any movie…" autocomplete="off">
        <button type="submit">Look up</button>
      </form>
    </section>

    <section id="movie" hidden>
      <div class="hero">
        <img id="poster" class="poster" alt="">
        <div class="hero-text">
          <h1 id="title"></h1>
          <p id="episode-line" class="episode-line" hidden></p>
          <p id="tagline" class="tagline"></p>
          <p id="meta" class="meta"></p>
          <div id="playback" class="playback" hidden>
            <div id="progress" class="progress"><div id="progress-bar"></div></div>
            <p id="progress-text" class="meta small"></p>
          </div>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button role="tab" data-tab="spotlight" class="active">Spotlight</button>
        <button role="tab" data-tab="imdb">Trivia <span id="imdb-count" class="count"></span></button>
        <button role="tab" data-tab="goofs">Goofs <span id="goofs-count" class="count"></span></button>
        <button role="tab" data-tab="wiki">Wikipedia</button>
      </div>

      <div id="loading" class="loading" hidden>Finding trivia…</div>
      <div id="error" class="error" hidden></div>

      <div id="tab-spotlight" class="panel">
        <article id="spot-card" class="spot-card">
          <div id="spot-source" class="spot-source"></div>
          <p id="spot-text" class="spot-text"></p>
        </article>
        <div class="spot-controls">
          <button id="spot-prev" class="icon-button" aria-label="Previous fact">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
          </button>
          <button id="spot-auto" class="auto-toggle icon-button" aria-pressed="true" aria-label="Auto-advance" title="Auto-advance: on">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6c3.3 0 6 2.7 6 6 0 1-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.3 0-6-2.7-6-6 0-1 .25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
          </button>
          <button id="spot-next" class="icon-button" aria-label="Next fact">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 8.6 7.4l4.6 4.6-4.6 4.6L10 18l6-6z"/></svg>
          </button>
        </div>
        <p id="spot-note" class="spot-note" aria-live="polite"></p>
        <div id="spot-timer" class="spot-timer"><div></div></div>
      </div>

      <div id="tab-imdb" class="panel" hidden>
        <ol id="imdb-list" class="facts"></ol>
      </div>

      <div id="tab-goofs" class="panel" hidden>
        <ol id="goofs-list" class="facts"></ol>
      </div>

      <div id="tab-wiki" class="panel" hidden>
        <div id="wiki-content"></div>
      </div>

      <button id="back-to-playing" class="link-button" hidden>← Back to what's playing</button>
    </section>
  </main>

  <dialog id="sources-dialog" class="sheet" aria-labelledby="sources-title">
    <form method="dialog">
      <div class="sheet-head">
        <h2 id="sources-title">Sources</h2>
        <button class="sheet-done" value="done">Done</button>
      </div>
      <p class="hint">Choose what to show on this device.</p>
      <div id="sources-form"></div>
      <button type="button" id="sources-reset" class="link-reset">Show everything</button>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
