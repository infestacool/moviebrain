<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <title>Sign in · Moviebrain</title>
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-title" content="Moviebrain">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="login">
    <div class="empty-icon">🧠</div>
    <h1>Moviebrain</h1>
    <p class="meta">Sign in to see trivia for what's playing.</p>
    <p id="error" class="error" hidden></p>
    <a id="signin" class="signin-button" href="#">Sign in</a>
  </main>
  <script>
    const err = new URLSearchParams(location.search).get("error");
    if (err) { const e = document.getElementById("error"); e.textContent = err; e.hidden = false; }
    fetch("/api/auth/status").then((r) => r.json()).then((s) => {
      if (s.mode === "none" || s.user) { location.href = "/"; return; }
      const btn = document.getElementById("signin");
      btn.href = "/auth/" + (s.mode === "plex" ? "plex" : "oidc") + "/start";
      btn.textContent = s.mode === "plex" ? "Sign in with Plex" : "Sign in with " + s.oidc_name;
      btn.classList.add(s.mode === "plex" ? "plex" : "oidc");
    });
  </script>
</body>
</html>
